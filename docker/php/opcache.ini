; PHP recompiles every source file on every request unless OPcache holds the compiled
; bytecode in shared memory. For Laravel that is several hundred files per request whose
; compilation result is otherwise thrown away immediately.
;
; The image ships OPcache but leaves it off, so this file both installs the tuning and turns
; it on. FPM only — CLI stays at its default (disabled), which keeps artisan, the queue worker
; and the scheduler reading source straight from disk. They are the processes most likely to
; run right after a deploy, and short-lived commands gain almost nothing from caching anyway.

opcache.enable=1

; ~5900 PHP files in app + vendor today. The setting is rounded up to the next prime
; internally; leaving headroom costs a little memory and avoids silent cache eviction, which
; degrades into "some requests are slow" rather than an error.
opcache.max_accelerated_files=20000

opcache.memory_consumption=192
opcache.interned_strings_buffer=16

; Deliberately NOT validate_timestamps=0, which is the usual production advice.
;
; With checking disabled, PHP never looks at the files again and a deploy without an fpm
; restart serves the old code forever — no error, no log entry, just stale behaviour. That
; failure mode already cost us an afternoon once, in a different guise.
;
; revalidate_freq=2 means each file's mtime is checked at most every two seconds. On this
; workload the cost is unmeasurable and a forgotten restart fixes itself.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Keeps the fpm master's memory from being consumed twice over when workers are recycled.
opcache.max_wasted_percentage=10
