services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zkbio_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - zkbio_network

  nginx:
    image: nginx:alpine
    container_name: zkbio_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - zkbio_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zkbio_queue
    restart: unless-stopped
    working_dir: /var/www
    # --max-time recycles the worker hourly so it picks up deployed code instead of serving
    # whatever was loaded when the container started. Restart policy brings it straight back.
    command: php artisan queue:work --sleep=3 --timeout=3600 --max-time=3600
    volumes:
      - .:/var/www
    networks:
      - zkbio_network
    depends_on:
      - postgres

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zkbio_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - .:/var/www
    networks:
      - zkbio_network
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: zkbio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zkbio
      POSTGRES_USER: zkbio
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zkbio_network

networks:
  zkbio_network:
    driver: bridge

volumes:
  postgres_data:
